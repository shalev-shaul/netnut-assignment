apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-manager
  namespace: netnut
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-manager
  template:
    metadata:
      labels:
        app: job-manager
    spec:
      containers:
        - name: job-manager
          image: netnut/job-manager:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: netnut-config
            - secretRef:
                name: netnut-secrets
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: job-manager
  namespace: netnut
spec:
  selector:
    app: job-manager
  ports:
    - port: 3001
      targetPort: 3001
