apiVersion: v1
kind: ConfigMap
metadata:
  name: netnut-config
  namespace: netnut
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: netnut
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JOB_MANAGER_HOST: job-manager
  PORT: "3001"
  PORT: "3000"
---
apiVersion: v1
kind: Secret
metadata:
  name: netnut-secrets
  namespace: netnut
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASS: postgres
  # Proxy connection string for jobs with useProxy:true (consumed by scraper).
  # Real values carry credentials (http://user:pass@gateway:port) — hence Secret.
  # Leave empty to disable; such jobs will then fail loudly.
  PROXY_URL: ""
