apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: netnut
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
        - name: proxy
          image: monokal/tinyproxy:latest
          args: ['ANY']
          ports:
            - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: netnut
spec:
  selector:
    app: proxy
  ports:
    - port: 8888
      targetPort: 8888
