apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: netnut
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: netnut/api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: netnut-config
            - secretRef:
                name: netnut-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: netnut
spec:
  selector:
    app: api
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
